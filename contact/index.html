<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Grenyion Advisory</title>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>

<header>
  <h1 class="logo">
    <a href="/">
      <img src="/logo.png" alt="Grenyion Advisory Logo">
      <span>Grenyion Advisory</span>
    </a>
  </h1>
  <nav>
    <a href="/">Home</a>
    <a href="/services">Services</a>
    <a href="/about">About</a>
    <a href="/contact" class="active">Contact</a>
  </nav>
</header>

<section>
  <h2>Contact</h2>

  <p>
    Interested in working together or have questions about your organization's security? Fill out the form below and I'll get back to you.
  </p>

  <form id="contactForm" action="mailto:terrell@grenyionadvisory.com?subject=[INQUIRY]%20New%20Service%20Inquiry" method="POST" enctype="text/plain">

    <label for="name">Name</label><br/>
    <input type="text" id="name" name="Name" required maxlength="100" pattern="[A-Za-z0-9 .,'-]+"><br/><br/>

    <label for="email">Email</label><br/>
    <input type="email" id="email" name="Email" required maxlength="150"><br/><br/>

    <label for="organization">Organization</label><br/>
    <input type="text" id="organization" name="Organization" maxlength="150" pattern="[A-Za-z0-9 .,&'\-]+"><br/><br/>

    <label for="message">Inquiry</label><br/>
    <textarea id="message" name="Message" rows="6" required maxlength="2000">Please include the following in your inquiry:

• Service you are interested in
• Brief description of your organization
• Any specific security concerns or goals
• Timeline (if applicable)

Additional details are always helpful.</textarea><br/><br/>

    <button type="submit">Send Inquiry</button>

  </form>

  <script>
    function sanitizeInput(str) {
      return str
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;")
        .trim();
    }

    document.getElementById('contactForm').addEventListener('submit', function(e) {
      const fields = ['name', 'email', 'organization', 'message'];
      fields.forEach(id => {
        const el = document.getElementById(id);
        if (el && el.value) el.value = sanitizeInput(el.value);
      });
    });
  </script>

  <p>
    You can also reach me directly at terrell@grenyionadvisory.com
  </p>
</section>

<footer>
  <p>© 2026 Grenyion Advisory</p>
</footer>

<script src="/script.js"></script>
</body>
</html>
